apiVersion: 1

deleteDatasources:
  - name: prometheus
    orgId: 1
  - name: prometheus-1
    orgId: 1
  - name: prometheus-2
    orgId: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: true
    jsonData:
      maxLines: 1000

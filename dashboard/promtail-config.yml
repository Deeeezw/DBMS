server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    tenant_id: fake

scrape_configs:

  # ── Collect all Docker container logs via Docker SD ──────────────────────────
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.project=distr"]
    pipeline_stages:
      - docker: {}
      - labeldrop:
          - filename
    relabel_configs:
      # container name (strip leading slash)
      - source_labels: ['__meta_docker_container_name']
        regex: '/?(.*)'
        target_label: container
      # compose service name
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service
      # log stream (stdout / stderr)
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: stream
      # keep only the containers we care about
      - source_labels: [service]
        regex: 'master1|master2|shard1|shard2|shard3|shard4|shard5|shard6|backend|prometheus|grafana|loki|promtail|cadvisor|postgres-exporter'
        action: keep
